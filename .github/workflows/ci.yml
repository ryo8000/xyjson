name: CI

on:
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: 22.x

jobs:
  check-changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test-needed: ${{ steps.filter.outputs.test-needed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed files
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          CHANGED=$(git diff --name-only "$BASE...$HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(\.github/workflows/|scripts/|src/|\.vscode-test\.mjs$|\.vscodeignore$|esbuild\.js$|eslint\.config\.mjs$|package-lock\.json$|package\.json$|tsconfig\.json$)'; then
            echo "test-needed=true" >> $GITHUB_OUTPUT
          else
            echo "test-needed=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Test
    needs: check-changes
    if: needs.check-changes.outputs.test-needed == 'true'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Run integration tests (non-Linux)
        if: runner.os != 'Linux'
        run: npm run test:integration

      - name: Package extension
        if: runner.os == 'Linux'
        run: npm run vscode:package

  audit:
    name: Audit dependencies
    needs: check-changes
    if: needs.check-changes.outputs.test-needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  ci-status:
    name: CI Status
    needs: [check-changes, test, audit]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Check job results
        env:
          CHECK_CHANGES: ${{ needs.check-changes.result }}
          TEST: ${{ needs.test.result }}
          AUDIT: ${{ needs.audit.result }}
        shell: bash
        run: |
          if [[ "$CHECK_CHANGES" != "success" ]]; then
            echo "CI failed (check-changes=$CHECK_CHANGES)"
            exit 1
          fi
          if [[ "$TEST" != "success" && "$TEST" != "skipped" ]]; then
            echo "CI failed (test=$TEST)"
            exit 1
          fi
          if [[ "$AUDIT" != "success" && "$AUDIT" != "skipped" ]]; then
            echo "CI failed (audit=$AUDIT)"
            exit 1
          fi
          echo "CI passed (test=$TEST, audit=$AUDIT)"
