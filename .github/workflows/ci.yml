name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check-changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test-needed: ${{ steps.filter.outputs.test-needed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed files
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          CHANGED=$(git diff --name-only "$BASE...$HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(\.github/workflows/|scripts/|src/|\.vscode-test\.mjs$|\.vscodeignore$|esbuild\.js$|eslint\.config\.mjs$|package-lock\.json$|package\.json$|tsconfig\.json$)'; then
            echo "test-needed=true" >> $GITHUB_OUTPUT
          else
            echo "test-needed=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Test
    needs: check-changes
    if: needs.check-changes.outputs.test-needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        vscode: [stable]
        include:
          # Minimum from engines.vscode
          - os: ubuntu-latest
            vscode: 1.101.0
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Cache VS Code
        if: matrix.vscode != 'stable'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ matrix.vscode }}

      - name: Run integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration -- --code-version ${{ matrix.vscode }}

      - name: Run integration tests (non-Linux)
        if: runner.os != 'Linux'
        run: npm run test:integration

      - name: Package extension
        if: runner.os == 'Linux' && matrix.vscode == 'stable'
        run: npm run vscode:package

  # New advisories for existing dependencies are left to Dependabot.
  dependency-review:
    name: Dependency review
    needs: check-changes
    if: needs.check-changes.outputs.test-needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime

  ci-status:
    name: CI Status
    needs: [check-changes, test, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Check job results
        env:
          CHECK_CHANGES: ${{ needs.check-changes.result }}
          TEST: ${{ needs.test.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        shell: bash
        run: |
          if [[ "$CHECK_CHANGES" != "success" ]]; then
            echo "CI failed (check-changes=$CHECK_CHANGES)"
            exit 1
          fi
          if [[ "$TEST" != "success" && "$TEST" != "skipped" ]]; then
            echo "CI failed (test=$TEST)"
            exit 1
          fi
          if [[ "$DEPENDENCY_REVIEW" != "success" && "$DEPENDENCY_REVIEW" != "skipped" ]]; then
            echo "CI failed (dependency-review=$DEPENDENCY_REVIEW)"
            exit 1
          fi
          echo "CI passed (test=$TEST, dependency-review=$DEPENDENCY_REVIEW)"
